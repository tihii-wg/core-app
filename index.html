<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/core-app-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" />
    <title>Core App</title>
    <script>
      // Mirrors applyProfileTheme; "coreapp-theme" must match profileThemeStorageKey in src/services/apiProfiles.ts.
      (function () {
        try {
          var path = window.location.pathname;
          if (path === "/" || /\/(login|register|forgot-password|reset-password)\/?$/.test(path)) return;
          var theme = window.localStorage.getItem("coreapp-theme");
          if (theme !== "light" && theme !== "dark" && theme !== "system") return;
          var dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            var background = getComputedStyle(document.documentElement).getPropertyValue("--background").trim();
            if (background) meta.setAttribute("content", background);
          }
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <!-- Shown until React renders; same look as src/ui/AppBootSpinner.tsx (one continuous spinner). -->
    <style>
      #boot-spinner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f6f7f9;color:#1a6de0}
      .dark #boot-spinner{background:#0e1014;color:#3b82f6}
      #boot-spinner svg{width:2.5rem;height:2.5rem;animation:boot-spin 1s linear infinite}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
    </style>
    <div id="root"><div id="boot-spinner" role="status"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
