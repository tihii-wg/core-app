<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/core-app-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" />
    <title>Core App</title>
    <script>
      // Mirrors applyProfileTheme; "coreapp-theme" must match profileThemeStorageKey in src/services/apiProfiles.ts.
      (function () {
        try {
          var path = window.location.pathname;
          if (path === "/" || /\/(login|register|forgot-password)\/?$/.test(path)) return;
          var theme = window.localStorage.getItem("coreapp-theme");
          if (theme !== "light" && theme !== "dark" && theme !== "system") return;
          var dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
