<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/core-app-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta name="description" content="Core App" />
    <title>Core App</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("core-app-admin-theme");
          if (theme !== "dark" && theme !== "light") theme = "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
          var locale = localStorage.getItem("core-app-admin-locale");
          document.documentElement.lang = locale === "ru" ? "ru" : "en";
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
